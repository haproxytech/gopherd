test:
  stage: test
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == 'push'
  image:
    name: $HAPROXY_REGISTRY_GO/golang:latest-alpine
    entrypoint: [""]
  tags:
    - go
  before_script:
    - go version
  script:
    - task test COUNT=1
  after_script:
    - |
      if [ "$CI_JOB_STATUS" == "success" ]; then
        junit-report add --status=ok --message="tests passed successfully"
      else
        junit-report add --status=failed --message="tests failed" --description="$(task test COUNT=1 2>&1)"
      fi
  artifacts:
    when: always
    paths:
      - junit-report.xml
    reports:
      junit: junit-report.xml
