build:
  stage: build
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == 'push'
  image:
    name: $HAPROXY_REGISTRY_GO/golang:latest-alpine
    entrypoint: [""]
  tags:
    - go
  before_script:
    - go version
  script:
    - go build -v -o gopherd .
  artifacts:
    paths:
      - gopherd
    expire_in: 1 day
