#https://taskfile.dev/
version: "3"

vars:
  YQ: github.com/mikefarah/yq/v4@v4.47.1
  CHECK_COMMIT: github.com/haproxytech/check-commit/v5@v5.5.3
  BETTERALIGN: github.com/dkorunic/betteralign/cmd/betteralign@v0.9.1
  STATICCHECK: honnef.co/go/tools/cmd/staticcheck@v0.7.0
  GOVULNCHECK: golang.org/x/vuln/cmd/govulncheck@v1.1.4
  GOFUMPT: mvdan.cc/gofumpt@v0.9.2
  REVIVE: github.com/mgechev/revive@v1.15.0
  GOTESTSUM: gotest.tools/gotestsum@v1.13.0
  GO_LICENSES: github.com/google/go-licenses@v1.6.0

env:
  TMP: tmp

dotenv:
  - .env

tasks:
  ci:
    desc: "run all checks"
    cmds:
      - task: check-commit
      - task: tidy
      - task: format
      - task: lint
      - task: test
        vars:
          COUNT: 1

  build:
    desc: "build gopherd binary for current platform"
    cmds:
      - go build -o gopherd .

  build-all:
    desc: "cross-compile gopherd for all release platforms"
    vars:
      OUT: '{{default "/tmp/gopherd-build" .OUT}}'
    cmds:
      - mkdir -p {{.OUT}}
      - |
        set -e
        platforms=(
          "linux/386"
          "linux/amd64"
          "linux/arm/5"
          "linux/arm/6"
          "linux/arm/7"
          "linux/arm64"
          "linux/ppc64le"
          "linux/riscv64"
          "linux/s390x"
          "darwin/amd64"
          "darwin/arm64"
          "freebsd/amd64"
          "freebsd/arm64"
        )
        for p in "${platforms[@]}"; do
          IFS='/' read -r os arch goarm <<< "$p"
          name="gopherd-${os}-${arch}"
          if [ -n "$goarm" ]; then
            name="${name}v${goarm}"
            export GOARM="$goarm"
            arch="arm"
          else
            unset GOARM
          fi
          echo "building ${name}..."
          CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -o "{{.OUT}}/${name}" . || exit 1
        done
        echo "all builds OK ({{.OUT}}/)"
      - rm -rf {{.OUT}}

  test:
    desc: "run Go tests"
    deps:
      - task: check-go-tool
        vars:
          TOOL: GOTESTSUM
    vars:
      PKG: '{{default "./..." .PKG}}'
      FORMAT: '{{default "testdox" .FORMAT}}'
    cmds:
      - |
        $(check-go-tool {{.GOTESTSUM}}) \
          --format-icons=hivis \
          --format={{.FORMAT}} \
          --format-hide-empty-pkg \
          -- {{if .COUNT}}-count={{.COUNT}}{{end}} \
            -v \
            {{.PKG}}

  bench:
    desc: "run performance benchmarks (zero-alloc logger hot path)"
    vars:
      COUNT: '{{default "3" .COUNT}}'
      TIME: '{{default "2s" .TIME}}'
      PKG: '{{default "./logger/" .PKG}}'
    cmds:
      - go test -bench=. -benchmem -count={{.COUNT}} -benchtime={{.TIME}} {{.PKG}}

  tidy:
    desc: "run Go mod tidy"
    cmds:
      - go mod tidy

  lint:
    desc: "run Go linters"
    deps:
      - task: check-go-tools
        vars:
          TOOLS: [BETTERALIGN, REVIVE, STATICCHECK]
    cmds:
      - "$(check-go-tool {{.REVIVE}}) -formatter friendly -set_exit_status ./..."
      - "$(check-go-tool {{.STATICCHECK}}) ./..."
      - "$(check-go-tool {{.BETTERALIGN}}) ./..."

  format:
    desc: "format the code"
    deps:
      - task: check-go-tools
        vars:
          TOOLS: [BETTERALIGN, GOFUMPT]
    cmds:
      - go fix ./...
      - "$(check-go-tool {{.BETTERALIGN}}) -apply ./... || true"
      - "$(check-go-tool {{.GOFUMPT}}) -l -w ."

  check-commit:
    deps:
      - task: check-go-tool
        vars:
          TOOL: CHECK_COMMIT
    cmds:
      - "$(check-go-tool {{.CHECK_COMMIT}})"

  govulncheck:
    deps:
      - task: check-go-tool
        vars:
          TOOL: GOVULNCHECK
    cmds:
      - "$(check-go-tool {{.GOVULNCHECK}}) -show verbose ./..."

  licenses:
    desc: "check licenses"
    deps:
      - task: check-go-tool
        vars:
          TOOL: GO_LICENSES
    cmds:
      - |
        PROJECT="$(go list -m)"
        BIN="$(check-go-tool {{.GO_LICENSES}})"
        $BIN report --ignore "$PROJECT" .
        $BIN check --ignore "$PROJECT" .

  legal:
    desc: "check legal"
    cmds:
      - task: govulncheck
      - task: licenses

  git-install-pre-push-hook:
    cmds:
      - echo '#!/bin/sh' > .git/hooks/pre-push
      - echo 'task ci' >> .git/hooks/pre-push
      - chmod +x .git/hooks/pre-push

# internal

  ensure-check-go-tool:
    desc: 'ensure check-go-tool is installed'
    silent: true
    internal: true
    status:
      - command -v check-go-tool
    cmds:
      - go install github.com/oktalz/check-go-tool@latest

  check-go-tool:
    desc: 'ensure go tool is installed/available'
    silent: true
    internal: true
    deps:
      - task: ensure-check-go-tool
    cmds:
      - check-go-tool '{{ index . .TOOL }}' >/dev/null

  check-go-tools:
    desc: 'ensure all go tools are installed'
    silent: true
    internal: true
    cmds:
      - for:
          var: TOOLS
        task: check-go-tool
        vars:
          TOOL: '{{.ITEM}}'
