#https://taskfile.dev/
version: "3"

dotenv:
  - .env

includes:
  vars:
    taskfile: taskfile/.vars.yml
    flatten: true
  tools:
    taskfile: taskfile/.tools.yml
    flatten: true
  git:
    taskfile: taskfile/git.yml
    flatten: true
  go-tools:
    taskfile: taskfile/go-tools.yml
    flatten: true

tasks:
  ci:
    desc: "run all checks"
    cmds:
      - task: check-commit
      - task: tidy
      - task: format
      - task: lint
      - task: test
        vars:
          COUNT: 1

  build:
    desc: "build gopherd binary for current platform"
    cmds:
      - go build -o gopherd .

  build-all:
    desc: "cross-compile gopherd for all release platforms"
    vars:
      OUT: '{{default "/tmp/gopherd-build" .OUT}}'
    cmds:
      - mkdir -p {{.OUT}}
      - |
        set -e
        platforms=(
          "linux/386"
          "linux/amd64"
          "linux/arm/5"
          "linux/arm/6"
          "linux/arm/7"
          "linux/arm64"
          "linux/ppc64le"
          "linux/riscv64"
          "linux/s390x"
          "darwin/amd64"
          "darwin/arm64"
          "freebsd/amd64"
          "freebsd/arm64"
        )
        for p in "${platforms[@]}"; do
          IFS='/' read -r os arch goarm <<< "$p"
          name="gopherd-${os}-${arch}"
          if [ -n "$goarm" ]; then
            name="${name}v${goarm}"
            export GOARM="$goarm"
            arch="arm"
          else
            unset GOARM
          fi
          echo "building ${name}..."
          CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -o "{{.OUT}}/${name}" . || exit 1
        done
        echo "all builds OK ({{.OUT}}/)"
      - rm -rf {{.OUT}}

  test:
    desc: "run Go tests"
    deps:
      - task: check-go-tool
        vars:
          TOOL: GOTESTSUM
    vars:
      PKG: '{{default "./..." .PKG}}'
      FORMAT: '{{default "testdox" .FORMAT}}'
    cmds:
      - |
        /{{.TMP}}/gotestsum/{{.GOTESTSUM_VERSION}}/gotestsum \
          --format-icons=hivis \
          --format={{.FORMAT}} \
          --format-hide-empty-pkg \
          -- {{if .COUNT}}-count={{.COUNT}}{{end}} \
            -v \
            {{.PKG}}

  bench:
    desc: "run performance benchmarks (zero-alloc logger hot path)"
    vars:
      COUNT: '{{default "3" .COUNT}}'
      TIME: '{{default "2s" .TIME}}'
      PKG: '{{default "./logger/" .PKG}}'
    cmds:
      - go test -bench=. -benchmem -count={{.COUNT}} -benchtime={{.TIME}} {{.PKG}}

  tidy:
    desc: "run Go mod tidy"
    cmds:
      - go mod tidy

  lint:
    desc: "run Go linters"
    deps:
      - task: check-go-tools
        vars:
          TOOLS: [BETTERALIGN, REVIVE, STATICCHECK]
    cmds:
      - /{{.TMP}}/revive/{{.REVIVE_VERSION}}/revive -formatter friendly -set_exit_status ./...
      - /{{.TMP}}/staticcheck/{{.STATICCHECK_VERSION}}/staticcheck ./...
      - /{{.TMP}}/betteralign/{{.BETTERALIGN_VERSION}}/betteralign ./...

  format:
    desc: "format the code"
    deps:
      - task: check-go-tools
        vars:
          TOOLS: [BETTERALIGN, GOFUMPT]
    cmds:
      - go fix ./...
      - /{{.TMP}}/betteralign/{{.BETTERALIGN_VERSION}}/betteralign -apply ./... || true
      - /{{.TMP}}/gofumpt/{{.GOFUMPT_VERSION}}/gofumpt -l -w .

  check-commit:
    deps:
      - task: check-go-tool
        vars:
          TOOL: CHECK_COMMIT
    cmds:
      - /{{.TMP}}/check-commit/{{.CHECK_COMMIT_VERSION}}/check-commit

  govulncheck:
    deps:
      - task: check-go-tool
        vars:
          TOOL: GOVULNCHECK
    cmds:
      - /{{.TMP}}/govulncheck/{{.GOVULNCHECK_VERSION}}/govulncheck -show verbose ./...

  licenses:
    desc: "check licenses"
    deps:
      - task: check-go-tool
        vars:
          TOOL: GO_LICENSES
    cmds:
      - |
        PROJECT="$(go list -m)"
        /{{.TMP}}/go-licenses/{{.GO_LICENSES_VERSION}}/go-licenses report --ignore "$PROJECT" .
        /{{.TMP}}/go-licenses/{{.GO_LICENSES_VERSION}}/go-licenses check --ignore "$PROJECT" .

  legal:
    desc: "check legal"
    cmds:
      - task: govulncheck
      - task: licenses
