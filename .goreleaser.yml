before:
  hooks:
    - go mod tidy
builds:
  - env:
      - CGO_ENABLED=0
    binary: gopherd
    id: gopherd
    main: .
    goos:
      - linux
      - darwin
      - freebsd
    goarch:
      - "386"
      - amd64
      - arm
      - arm64
      - ppc64le
      - riscv64
      - s390x
    goarm:
      - "5"
      - "6"
      - "7"
archives:
  - name_template: |-
      {{- $prettyOS := .Os -}}
      {{- if eq $prettyOS "darwin" -}}
      	{{- $prettyOS = "Darwin" -}}
      {{- else if eq $prettyOS "linux" -}}
      	{{- $prettyOS = "Linux" -}}
      {{- else if eq $prettyOS "freebsd" -}}
      	{{- $prettyOS = "FreeBSD" -}}
      {{- end -}}

      {{- $prettyArch := .Arch -}}
      {{- if eq $prettyArch "386" -}}
      	{{- $prettyArch = "i386" -}}
      {{- else if eq $prettyArch "amd64" -}}
      	{{- $prettyArch = "x86_64" -}}
      {{- end -}}
      {{.Binary}}_{{.Version}}_{{$prettyOS}}_{{$prettyArch}}
checksum:
  name_template: 'checksums.txt'
changelog:
  sort: asc
  use: git
snapshot:
  name_template: "{{ .Tag }}-next"
release:
  draft: false
  header: |
    ## Release Notes
    gopherd {{.Tag}} {{.ShortCommit}}

    Build date: {{.Date}}
  name_template: "gopherd v{{.Version}}"
