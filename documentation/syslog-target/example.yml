# Forward service logs to a remote syslog server.
# Log-targets require log-capture (capture is off by default).
log-capture: true
processes:
  - name: app
    command: /usr/local/bin/app
    args: ["300"]
    on-failure: shutdown
log-targets:
  remote:
    type: syslog
    location: udp://logs.example.com:514
    services: [app]
    labels:
      env: production
