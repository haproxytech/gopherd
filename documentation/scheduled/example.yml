# Run a backup at 03:00 every night; the app runs continuously.
processes:
  - name: app
    command: /usr/local/bin/app
    args: ["300"]
    on-success: ignore
    on-failure: shutdown
  - name: backup
    command: /usr/local/bin/backup
    args: ["-c", "echo backup done; exit 0"]
    startup: scheduled
    schedule: "0 3 * * *" # min hour day-of-month month day-of-week
    startup-timeout: 30m
