# Pipelines run only for MRs and manual (web/API) runs; branch pushes create none.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == 'api'
    - if: $CI_PIPELINE_SOURCE == 'web'

# Extend to run in every allowed pipeline; rule-less jobs drop out of MR pipelines.
.all-pipelines:
  rules:
    - when: on_success

stages:
  - lint
  - security
  - test
  - build
variables:
  HAPROXY_REGISTRY_GO: "registry.haproxy.com/gophers"
  # One toolchain for every job, matching go.mod: `go fix` output differs between releases.
  GO_VERSION: "1.27"
  JUNIT_FILE: "junit-report.xml"
  GOTESTSUM_JUNITFILE: "junit-report.xml"

include:
  - local: .gitlab/lint.yml
  - local: .gitlab/security.yml
  - local: .gitlab/test.yml
  - local: .gitlab/build.yml
