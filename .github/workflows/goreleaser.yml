name: goreleaser
on:
  push:
    tags:
      - "*"
  # Rebuild an existing tag with the current Go toolchain (e.g. CVE fix in Go).
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to rebuild and re-release (e.g. v0.5.0); empty = latest tag"
        required: false
        default: ""
  # Weekly rebuild of the latest tag with the current Go toolchain; schedules
  # only run on the default branch.
  schedule:
    - cron: "0 3 * * 0"
# Creates the GitHub release and pushes the container images.
permissions:
  contents: write
  packages: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
      - name: Check out latest tag
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tag == '')
        run: git checkout "$(git tag --sort=-v:refname | head -n1)"
      - name: Keep the latest image tag on the newest release
        # Rebuilding an older tag must not drag the registry's latest tag back.
        run: |
          latest="$(git tag --sort=-v:refname | head -n1)"
          current="$(git describe --tags --exact-match)"
          if [ "$current" != "$latest" ]; then
            echo "PUBLISH_LATEST=false" >> "$GITHUB_ENV"
            echo "Building $current, not the newest tag ($latest); the latest image tag stays untouched."
          fi
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          check-latest: true
      # setup-go exports GOTOOLCHAIN=local via GITHUB_ENV; a later write wins.
      - name: Allow Go toolchain downloads
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        # Needs DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets.
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
